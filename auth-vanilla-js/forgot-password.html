<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Employee Leave Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <div class="logo-badge">L</div>
      <h2>Reset Password</h2>
      <p>Enter your registered email and choose a new password</p>
    </div>

    <!-- General Alert Box -->
    <div class="alert-box alert-error" id="forgotAlert"></div>

    <!-- Forgot Password Form -->
    <form id="forgotPasswordForm" novalidate>
      
      <!-- Field 1: Email Address -->
      <div class="form-group">
        <label for="forgotEmail">Registered Email Address</label>
        <input 
          type="email" 
          id="forgotEmail" 
          placeholder="name@example.com" 
          autocomplete="email"
        >
        <span class="error-msg" id="forgotEmailError"></span>
      </div>

      <!-- Field 2: New Password -->
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input 
          type="password" 
          id="newPassword" 
          placeholder="At least 6 chars, 1 uppercase, 1 number"
          autocomplete="new-password"
        >
        <span class="error-msg" id="newPasswordError"></span>
      </div>

      <!-- Field 3: Confirm New Password -->
      <div class="form-group">
        <label for="confirmNewPassword">Confirm New Password</label>
        <input 
          type="password" 
          id="confirmNewPassword" 
          placeholder="Re-enter your new password"
          autocomplete="new-password"
        >
        <span class="error-msg" id="confirmNewPasswordError"></span>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-primary" id="resetBtn">
        Reset Password →
      </button>

      <!-- Back to Login Link -->
      <div class="auth-footer">
        Remember your password? <a href="login.html">Back to Login</a>
      </div>
    </form>
  </div>

  <!-- =========================================================================
       JavaScript Success Popup Modal: "Password Reset Successfully"
       ========================================================================= -->
  <div class="popup-overlay" id="resetSuccessPopup">
    <div class="popup-box">
      <div class="popup-icon-circle">✓</div>
      <h3 class="popup-title">Password Reset Successfully!</h3>
      <p class="popup-message">
        Your password has been updated. Please login with your new credentials.
      </p>
      <button type="button" class="popup-btn" id="popupProceedLoginBtn">
        Go to Login →
      </button>
    </div>
  </div>

  <script>
    // =========================================================================
    // JavaScript Forgot Password & Reset Logic
    // =========================================================================

    // 1. DOM Element References
    const forgotPasswordForm = document.getElementById("forgotPasswordForm");
    const forgotEmailInput = document.getElementById("forgotEmail");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmNewPasswordInput = document.getElementById("confirmNewPassword");

    const forgotEmailError = document.getElementById("forgotEmailError");
    const newPasswordError = document.getElementById("newPasswordError");
    const confirmNewPasswordError = document.getElementById("confirmNewPasswordError");
    const forgotAlert = document.getElementById("forgotAlert");

    const resetSuccessPopup = document.getElementById("resetSuccessPopup");
    const popupProceedLoginBtn = document.getElementById("popupProceedLoginBtn");

    // 2. Helper Functions
    function clearForgotErrors() {
      forgotEmailError.textContent = "";
      newPasswordError.textContent = "";
      confirmNewPasswordError.textContent = "";
      forgotAlert.style.display = "none";
      forgotAlert.textContent = "";
    }

    // Email validation
    function validateEmailFormat(email) {
      const trimmed = email.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!trimmed) {
        return "Email address is required.";
      }
      if (!emailRegex.test(trimmed)) {
        return "Please enter a valid email address.";
      }
      return "";
    }

    // Password strength validation: min 6 chars, 1 uppercase, 1 number
    function validatePasswordStrength(password) {
      if (!password) {
        return "New password is required.";
      }
      if (password.length < 6) {
        return "Password must be at least 6 characters long.";
      }
      if (!/[A-Z]/.test(password)) {
        return "Password must contain at least 1 uppercase letter.";
      }
      if (!/[0-9]/.test(password)) {
        return "Password must contain at least 1 number.";
      }
      return "";
    }

    // Confirm password matching
    function validatePasswordMatch(password, confirmPassword) {
      if (!confirmPassword) {
        return "Please confirm your new password.";
      }
      if (password !== confirmPassword) {
        return "Passwords do not match.";
      }
      return "";
    }

    // =========================================================================
    // 3. Form Submit Event Listener
    // =========================================================================
    forgotPasswordForm.addEventListener("submit", function(event) {
      event.preventDefault();
      clearForgotErrors();

      const email = forgotEmailInput.value.trim().toLowerCase();
      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmNewPasswordInput.value;

      // Validate inputs
      const emailErr = validateEmailFormat(email);
      const passErr = validatePasswordStrength(newPassword);
      const confirmErr = validatePasswordMatch(newPassword, confirmPassword);

      let hasError = false;

      if (emailErr) {
        forgotEmailError.textContent = emailErr;
        hasError = true;
      }
      if (passErr) {
        newPasswordError.textContent = passErr;
        hasError = true;
      }
      if (confirmErr) {
        confirmNewPasswordError.textContent = confirmErr;
        hasError = true;
      }

      if (hasError) {
        return; // Stop if form validation fails
      }

      // Check user existence in localStorage
      const usersData = localStorage.getItem("users");
      const users = usersData ? JSON.parse(usersData) : [];

      const userIndex = users.findIndex(
        user => user.email.toLowerCase() === email
      );

      if (userIndex === -1) {
        forgotEmailError.textContent = "No registered account found with this email address.";
        return;
      }

      // Update password in localStorage
      users[userIndex].password = newPassword;
      localStorage.setItem("users", JSON.stringify(users));

      // Show Popup Modal and redirect
      resetSuccessPopup.classList.add("active");

      function redirectToLogin() {
        window.location.href = "login.html";
      }

      popupProceedLoginBtn.addEventListener("click", redirectToLogin);

      // Alert fallback and auto redirect
      setTimeout(() => {
        alert("Password reset successfully! Please login with your new password.");
        redirectToLogin();
      }, 500);
    });
  </script>

</body>
</html>
